spring.application.name=developer-knowledge-assistant

# ---------------------------------------------------------------------------
# MySQL
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devassistant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# schema.sql is used only as a reference / manual-setup script.
# ddl-auto=update lets Hibernate create/maintain the tables automatically.
spring.sql.init.mode=never

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-value-in-dot-env-file-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Gemini API
# ---------------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}# ---------------------------------------------------------------------------
# GitHub API
# ---------------------------------------------------------------------------
github.api.token=${GITHUB_TOKEN:}
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}

# ---------------------------------------------------------------------------
# File upload
# ---------------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:uploads/policies}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# CORS - allow the plain HTML/CSS/JS frontend (served separately) to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

server.port=${SERVER_PORT:8080}
