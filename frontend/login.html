<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - CoreCode</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">AI-Powered Developer Knowledge &amp; Policy Assistant</p>

    <div id="alert-box" class="alert alert-error hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
    </form>

    <div class="switch-link">
      Don't have an account? <a href="register.html">Register</a>
    </div>

    <div class="demo-accounts">
      <strong>Demo accounts (seeded automatically):</strong><br>
      Admin &mdash; <code>admin@devassistant.com</code> / <code>Admin@123</code><br>
      Developer &mdash; <code>developer@devassistant.com</code> / <code>Dev@12345</code>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlertLocal();
    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.textContent = "Logging in...";
    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const result = await Api.login(email, password);
      Auth.saveSession(result);
      window.location.href = "dashboard.html";
    } catch (err) {
      showAlertLocal(err.message || "Login failed");
    } finally {
      btn.disabled = false;
      btn.textContent = "Log In";
    }
  });

  function showAlertLocal(msg) {
    const box = document.getElementById("alert-box");
    box.textContent = msg;
    box.classList.remove("hidden");
  }
  function hideAlertLocal() {
    document.getElementById("alert-box").classList.add("hidden");
  }
</script>
</body>
</html>
