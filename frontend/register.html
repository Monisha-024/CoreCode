<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - CoreCode</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create an account</h1>
    <p class="subtitle">AI-Powered Developer Knowledge &amp; Policy Assistant</p>

    <div id="alert-box" class="alert alert-error hidden"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Jordan Lee">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role">
          <option value="DEVELOPER">Developer</option>
          <option value="ADMIN">Admin</option>
        </select>
        <div class="help-text">For this demo, role is self-selected at signup. In production, admin accounts would be provisioned separately.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create Account</button>
    </form>

    <div class="switch-link">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideAlertLocal();
    const btn = document.getElementById("register-btn");
    btn.disabled = true;
    btn.textContent = "Creating account...";
    try {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const result = await Api.register(name, email, password, role);
      Auth.saveSession(result);
      window.location.href = "dashboard.html";
    } catch (err) {
      showAlertLocal(err.message || "Registration failed");
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Account";
    }
  });

  function showAlertLocal(msg) {
    const box = document.getElementById("alert-box");
    box.textContent = msg;
    box.classList.remove("hidden");
  }
  function hideAlertLocal() {
    document.getElementById("alert-box").classList.add("hidden");
  }
</script>
</body>
</html>
